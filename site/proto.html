<!doctype html>
<meta charset="utf-8">
<title>design-clone · redirect</title>
<script>
// M105-W2：单页合一重定向 stub（保旧链接/e2e 迁移期）
var map = { "gallery.html": "see", "proto.html": "play", "guide.html": "clone", "start.html": "start" };
var sec = map[location.pathname.split("/").pop()] || "prologue";
var q = new URLSearchParams(location.search);
var h = "#" + sec;
if (q.get("app")) h += "&app=" + encodeURIComponent(q.get("app"));
if (q.get("q")) h += "&q=" + encodeURIComponent(q.get("q"));
location.replace("index.html" + h);
</script>
