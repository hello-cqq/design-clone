<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — design-clone</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html">design-clone</a>
  <nav class="navwrap">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="gallery.html" class="on" data-i18n="nav_gallery">Gallery</a>
  </nav>
  <span class="sp"></span>
  <button class="iconbtn" id="langbtn">中文</button>
  <button class="iconbtn" id="themebtn"></button>
  <a class="iconbtn" href="https://github.com/hello-cqq/design-clone" target="_blank" rel="noopener"><span class="starbadge" id="starbadge">★ —</span></a>
</div></header>
<div class="wrap">
  <section class="blk">
    <h2 data-i18n="gal_h">Gallery</h2>
    <p class="sub" data-i18n="gal_sub">Community prototypes on GitHub Pages. Search, filter by tag, play, download, remix.</p>
    <div class="filters">
      <input id="q" data-i18n-ph="gal_search" placeholder="search name or tag…">
      <select id="sort">
        <option value="dl" data-i18n="gal_sort_dl">most downloads</option>
        <option value="upd" data-i18n="gal_sort_upd">recently updated</option>
      </select>
    </div>
    <div class="tagrow" id="tagrow"></div>
    <div class="cards" id="cards"></div>
  </section>
</div>
<footer class="ft"><div class="wrap"><span data-i18n="ft_note">MIT · prototypes carry their own license · brand replicas are unofficial study works</span></div></footer>
<script src="assets/site.js"></script>
</body>
</html>
