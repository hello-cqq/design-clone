<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物乐园 · 05-me — 自研原创示例站</title>
<style>html,body{margin:0;padding:0}body{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(120,90,60,.12);min-height:100vh}</style>
<style>
  .pp-root{font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#4a3f35;background:
    radial-gradient(120% 60% at 50% -10%, #fff7ea 0%, #fdf3e3 45%, #fbeeda 100%);min-height:100%;position:relative;padding:52px 16px 108px;box-sizing:border-box}
  .pp-clay{background:#fffdf8;border-radius:24px;box-shadow:0 10px 24px rgba(180,140,90,.16), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -3px 0 rgba(190,150,100,.10);border:1px solid rgba(210,180,140,.25)}
  .pp-me{display:flex;gap:12px;align-items:center;margin:0 2px 14px}
  .pp-me img{width:56px;height:56px;border-radius:20px;object-fit:cover;filter:drop-shadow(0 8px 8px rgba(120,90,60,.25));cursor:pointer}
  .pp-me .nm{font-size:17px;font-weight:600}
  .pp-me .bd{font-size:11px;color:#a08d76;margin-top:3px}
  .pp-me .edit{margin-left:auto;width:30px;height:30px;border-radius:10px;background:#fffdf8;display:grid;place-items:center;box-shadow:0 4px 10px rgba(180,140,90,.14);cursor:pointer}
  .pp-vip{position:relative;padding:16px;margin-bottom:14px;background:linear-gradient(140deg,#d9c8f7,#c9b6f2 55%,#b79ded);border:none;color:#fff;overflow:hidden;transform:rotate(-1.2deg);box-shadow:0 14px 26px rgba(150,120,220,.35), inset 0 2px 0 rgba(255,255,255,.5);border-radius:24px;cursor:pointer}
  .pp-vip .pawwrap{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none}
  .pp-vip .paw{position:absolute;right:-14px;top:-14px;opacity:.22}
  .pp-vip .t{font-size:15px;font-weight:600}
  .pp-vip .d{font-size:11px;opacity:.85;margin:4px 0 10px}
  .pp-vip .pts{display:flex;gap:16px;font-size:11px}
  .pp-vip .pts b{display:block;font-size:16px;font-weight:600}
  .pp-rows{padding:6px 14px;margin-bottom:14px}
  .pp-row{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}
  .pp-row + .pp-row{border-top:1px dashed #eadbc4}
  .pp-row .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
  .pp-row .lb{font-size:13px;font-weight:500}
  .pp-row .mt{margin-left:auto;font-size:11px;color:#a08d76;display:flex;align-items:center;gap:4px}
  .pp-sw{width:38px;height:22px;border-radius:999px;background:#eadbc4;position:relative;transition:background .2s}
  .pp-sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fffdf8;box-shadow:0 2px 4px rgba(120,90,60,.25);transition:left .2s}
  .pp-sw.on{background:#7fd8be}
  .pp-sw.on::after{left:18px}
  .pp-tabs{position:absolute;left:14px;right:14px;bottom:26px;background:#fffdf8;border-radius:999px;display:flex;justify-content:space-around;padding:10px 6px;box-shadow:0 10px 24px rgba(180,140,90,.2), inset 0 2px 0 rgba(255,255,255,.9);z-index:8}
  .pp-tabs span{font-size:12px;color:#b3a28c;cursor:pointer;padding:6px 10px;border-radius:999px}
  .pp-tabs span.on{background:linear-gradient(140deg,#ffe3d1,#ffd2b8);color:#c05e2a;font-weight:600}
</style>
</head>
<body>
<div data-dc="pp/root" class="pp-root">
  <div class="pp-me" data-dc="pp/me"><img src="assets/pet-corgi.png" alt="" data-act="toast" data-msg="头像：旺财（演示）"><div><div class="nm">鹿非与旺财</div><div class="bd">入园 218 天 · 打卡 96 次</div></div><span class="edit" data-act="toast" data-msg="编辑资料（演示）"><svg width="14" height="14" viewBox="0 0 24 24" style="fill:none;stroke:#8a7660;stroke-width:2"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"></path></svg></span></div>
  <div class="pp-vip" data-dc="pp/vip" data-act="toast" data-msg="金毛会员权益：免预约 2 次/月 + 咖啡区 9 折（演示）">
    <span class="pawwrap"><svg class="paw" width="120" height="120" viewBox="0 0 24 24" style="fill:#fff"><ellipse cx="7" cy="8" rx="2.4" ry="3.1"></ellipse><ellipse cx="12" cy="6.6" rx="2.4" ry="3.1"></ellipse><ellipse cx="17" cy="8" rx="2.4" ry="3.1"></ellipse><path d="M12 11c3.4 0 6 2.6 6 5.2 0 1.7-1.3 2.8-3 2.8-1.2 0-2-.5-3-.5s-1.8.5-3 .5c-1.7 0-3-1.1-3-2.8C9 13.6 11.6 11 12 11z"></path></svg></span>
    <div class="t">金毛会员</div>
    <div class="d">2026-12-31 到期 · 已省 ¥268</div>
    <div class="pts"><span><b>1280</b>积分</span><span><b>6</b>优惠券</span><span><b>3</b>毛孩档案</span></div>
  </div>
  <div class="pp-rows pp-clay" data-dc="pp/rows">
    <div class="pp-row" data-act="toast" data-msg="我的预约：今天 14:00 草坪区（演示）"><span class="ic" style="background:#e8f7ee"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#3fae83;stroke-width:2"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg></span><span class="lb">我的预约</span><span class="mt">1 个进行中</span></div>
    <div class="pp-row" data-act="toast" data-msg="优惠券：咖啡区 9 折 ×2、门票 -10 ×4（演示）"><span class="ic" style="background:#ffece1"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#e07b39;stroke-width:2"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"></path></svg></span><span class="lb">优惠券</span><span class="mt">6 张</span></div>
    <div class="pp-row" data-act="toggle" data-target="[data-dc='pp/sw1']"><span class="ic" style="background:#efe7fb"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#8a63d2;stroke-width:2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></span><span class="lb">入园提醒</span><span class="mt"><span class="pp-sw on" data-dc="pp/sw1"></span></span></div>
    <div class="pp-row" data-act="toast" data-msg="帮助与客服：09:00-21:00 在线（演示）"><span class="ic" style="background:#e3f0fa"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#4aa3e8;stroke-width:2"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4"></path><circle cx="12" cy="17" r=".6" fill="#4aa3e8"></circle></svg></span><span class="lb">帮助与客服</span><span class="mt">在线</span></div>
  </div>
  <div class="pp-tabs" data-dc="pp/tabs"><span data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span class="on" data-goto="05-me">我的</span></div>
</div>

<script>
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]");
  if (g) { location.href = g.getAttribute("data-goto") + ".html"; }
});
</script>
</body>
</html>
