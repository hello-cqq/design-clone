<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7fb; --surface:#fff; --ink:#1c2333; --mut:#6b7280; --brand:#4f46e5; --line:#e5e7eb; --ok:#059669; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:56px; background:var(--surface); border-bottom:1px solid var(--line); }
  header .logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#8b5cf6); }
  nav a { padding:6px 12px; border-radius:8px; color:var(--mut); text-decoration:none; cursor:pointer; }
  nav a.on { background:#eef2ff; color:var(--brand); font-weight:600; }
  main { max-width:860px; margin:0 auto; padding:20px 24px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .row:first-child { border-top:0; }
  .tag { border-radius:999px; padding:2px 10px; font-size:11px; }
  .tag.todo { background:#fef3c7; color:var(--warn); } .tag.done { background:#d1fae5; color:var(--ok); } .tag.doing { background:#e0e7ff; color:var(--brand); }
  label.f { display:block; margin:12px 0 4px; color:var(--mut); font-size:12px; }
  input[type=text], textarea, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .btn { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 14px; cursor:pointer; }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
  .sw { width:38px; height:22px; border-radius:999px; background:#d1d5db; position:relative; cursor:pointer; transition:background .15s; }
  .sw[aria-checked=true] { background:var(--brand); }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; }
  .sw[aria-checked=true]::after { left:18px; }
</style>
<title>任务 — Orbit Tasks</title></head><body>
<header><span class="logo" data-dc="logo"></span><b>Orbit Tasks</b><nav><a data-dc="nav/board" data-goto="index">看板</a><a class="on" data-dc="nav/tasks">任务</a></nav></header>
<main><div class="panel">
  <div class="row" data-dc="row/a" data-goto="detail"><span class="tag doing">进行中</span><span style="flex:1">写克隆验收清单</span><span style="color:var(--mut);font-size:12px">今天</span></div>
  <div class="row" data-dc="row/b" data-goto="detail"><span class="tag todo">待办</span><span style="flex:1">补暗色 tokens</span><span style="color:var(--mut);font-size:12px">明天</span></div>
  <div class="row" data-dc="row/c" data-act="toast" data-msg="已完成：移除运行时 CDN"><span class="tag done">完成</span><span style="flex:1">移除运行时 CDN</span><span style="color:var(--mut);font-size:12px">周一</span></div>
</div></main></body></html>
