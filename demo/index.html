<!doctype html>
<!-- demo target：自研原创示例站（Orbit Tasks），供离线克隆/CI 冒烟/README 演示。
     不含任何第三方品牌资产；设计为通用 SaaS 任务面板风格。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Tasks — 示例站</title>
<style>
  :root { --bg:#f6f7fb; --surface:#fff; --ink:#1c2333; --mut:#6b7280; --brand:#4f46e5; --line:#e5e7eb; --ok:#059669; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:20px; padding:0 24px; height:56px; background:var(--surface); border-bottom:1px solid var(--line); }
  header .logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--brand),#8b5cf6); }
  header b { font-size:15px; }
  nav { display:flex; gap:4px; margin-left:12px; }
  nav a { padding:6px 12px; border-radius:8px; color:var(--mut); text-decoration:none; cursor:pointer; }
  nav a.on { background:#eef2ff; color:var(--brand); font-weight:600; }
  header .sp { flex:1; }
  header .btn { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; cursor:pointer; }
  header .btn.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
  main { display:flex; gap:20px; padding:20px 24px; max-width:1180px; margin:0 auto; }
  aside { width:200px; flex:none; }
  aside .grp { font-size:11px; color:var(--mut); letter-spacing:.06em; margin:14px 0 6px; }
  aside a { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; color:var(--ink); text-decoration:none; cursor:pointer; }
  aside a.on { background:#eef2ff; color:var(--brand); font-weight:600; }
  aside .dot { width:8px; height:8px; border-radius:50%; }
  section { flex:1; min-width:0; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .n { font-size:22px; font-weight:700; }
  .card .l { color:var(--mut); font-size:12px; }
  .list { margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .row:first-child { border-top:0; }
  .row:hover { background:#fafaff; }
  .row .t { flex:1; min-width:0; }
  .row .t .sub { color:var(--mut); font-size:12px; }
  .tag { border-radius:999px; padding:2px 10px; font-size:11px; }
  .tag.todo { background:#fef3c7; color:var(--warn); }
  .tag.done { background:#d1fae5; color:var(--ok); }
  .tag.doing { background:#e0e7ff; color:var(--brand); }
  footer { padding:18px 24px; color:var(--mut); font-size:12px; text-align:center; }
</style>
</head>
<body>
<header>
  <span class="logo" data-dc="logo"></span><b>Orbit Tasks</b>
  <nav>
    <a class="on" data-dc="nav/board" data-goto="index">看板</a>
    <a data-dc="nav/tasks" data-goto="tasks">任务</a>
    <a data-dc="nav/reports" data-act="toast" data-msg="报表示例：本周完成 12 项">报表</a>
  </nav>
  <span class="sp"></span>
  <button class="btn" data-dc="btn/help" data-act="toast" data-msg="帮助：这是一个自研示例站">帮助</button>
  <button class="btn pri" data-dc="btn/new" data-goto="detail">新建任务</button>
</header>
<main>
  <aside>
    <div class="grp">视图</div>
    <a class="on" data-dc="side/all" data-goto="index"><span class="dot" style="background:#4f46e5"></span>全部任务</a>
    <a data-dc="side/mine" data-act="toast" data-msg="我的任务：3 项进行中"><span class="dot" style="background:#059669"></span>我的任务</a>
    <a data-dc="side/backlog" data-act="toast" data-msg="Backlog：7 项待排期"><span class="dot" style="background:#9ca3af"></span>Backlog</a>
    <div class="grp">设置</div>
    <a data-dc="side/settings" data-goto="settings"><span class="dot" style="background:#d97706"></span>偏好设置</a>
  </aside>
  <section>
    <div class="cards">
      <div class="card" data-dc="kpi/open"><div class="n">8</div><div class="l">进行中</div></div>
      <div class="card" data-dc="kpi/done"><div class="n">23</div><div class="l">本周完成</div></div>
      <div class="card" data-dc="kpi/overdue"><div class="n">2</div><div class="l">已逾期</div></div>
    </div>
    <div class="list">
      <div class="row" data-dc="row/1" data-goto="detail"><span class="tag doing">进行中</span><span class="t">接入设计克隆自检门<b style="display:block" ></b><span class="sub" style="display:block">ui-smoke 覆盖播放/导出/写回</span></span><span style="color:var(--mut);font-size:12px">今天</span></div>
      <div class="row" data-dc="row/2" data-goto="detail"><span class="tag todo">待办</span><span class="t">补 demo 站点的暗色主题<span class="sub" style="display:block">tokens 双写 :root</span></span><span style="color:var(--mut);font-size:12px">明天</span></div>
      <div class="row" data-dc="row/3" data-act="toggle" aria-checked="false" role="checkbox"><span class="tag done">完成</span><span class="t">移除运行时 CDN<span class="sub" style="display:block">utilities.css 本地编译</span></span><span style="color:var(--mut);font-size:12px">周一</span></div>
    </div>
  </section>
</main>
<footer>© Orbit Tasks 示例站 · 自研原创，供 design-clone 离线克隆与 CI 冒烟使用</footer>
</body>
</html>
