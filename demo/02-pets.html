<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物乐园 · 02-pets — 自研原创示例站</title>
<style>html,body{margin:0;padding:0}body{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(120,90,60,.12);min-height:100vh}</style>
<style>
  .pp-root{font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#4a3f35;background:
    radial-gradient(120% 60% at 50% -10%, #fff7ea 0%, #fdf3e3 45%, #fbeeda 100%);min-height:100%;position:relative;padding:52px 16px 108px;box-sizing:border-box}
  .pp-clay{background:#fffdf8;border-radius:24px;box-shadow:0 10px 24px rgba(180,140,90,.16), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -3px 0 rgba(190,150,100,.10);border:1px solid rgba(210,180,140,.25)}
  .pp-head{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
  .pp-head .t{font-size:19px;font-weight:600}
  .pp-head .add{margin-left:auto;width:32px;height:32px;border-radius:12px;background:linear-gradient(140deg,#7fd8be,#5cc9ab);display:grid;place-items:center;box-shadow:0 6px 12px rgba(127,216,190,.4), inset 0 2px 0 rgba(255,255,255,.5);cursor:pointer}
  .pp-petcard{position:relative;padding:16px;margin-bottom:14px;transform:rotate(-1.6deg)}
  .pp-petcard .ph{position:relative;width:132px;margin:2px auto 8px}
  .pp-petcard .ph img{width:132px;height:132px;object-fit:cover;border-radius:34px;border:4px solid #fffdf8;box-shadow:0 16px 22px rgba(120,90,60,.28);cursor:pointer}
  .pp-petcard .ph::after{content:"";position:absolute;left:8%;right:8%;bottom:-8px;height:16px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, rgba(120,90,60,.22), rgba(120,90,60,0))}
  .pp-petcard .nm{text-align:center;font-size:17px;font-weight:600}
  .pp-petcard .bd{text-align:center;font-size:11px;color:#a08d76;margin:3px 0 12px}
  .pp-rings{display:flex;justify-content:space-around}
  .pp-rings .r{text-align:center;cursor:pointer}
  .pp-rings .r svg{display:block;margin:0 auto 4px}
  .pp-rings .r .lb{font-size:10px;color:#a08d76}
  .pp-rows{padding:6px 14px;margin-bottom:14px}
  .pp-row{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer}
  .pp-row + .pp-row{border-top:1px dashed #eadbc4}
  .pp-row .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
  .pp-row .lb{font-size:13px;font-weight:500}
  .pp-row .mt{margin-left:auto;font-size:11px;color:#a08d76}
  .pp-minis{display:flex;gap:10px}
  .pp-mini{flex:1;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer;transform:rotate(1.2deg)}
  .pp-mini img{width:40px;height:40px;border-radius:14px;object-fit:cover;filter:drop-shadow(0 6px 6px rgba(120,90,60,.25))}
  .pp-mini .nm{font-size:12px;font-weight:600}
  .pp-mini .bd{font-size:10px;color:#a08d76}
  .pp-tabs{position:absolute;left:14px;right:14px;bottom:26px;background:#fffdf8;border-radius:999px;display:flex;justify-content:space-around;padding:10px 6px;box-shadow:0 10px 24px rgba(180,140,90,.2), inset 0 2px 0 rgba(255,255,255,.9);z-index:8}
  .pp-tabs span{font-size:12px;color:#b3a28c;cursor:pointer;padding:6px 10px;border-radius:999px}
  .pp-tabs span.on{background:linear-gradient(140deg,#ffe3d1,#ffd2b8);color:#c05e2a;font-weight:600}
</style>
</head>
<body>
<div data-dc="pp/root" class="pp-root">
  <div class="pp-head" data-dc="pp/head"><span class="t">萌宠档案</span><span class="add" data-act="dialog" data-title="新增档案" data-body="为新的毛孩子建立乐园档案？（演示）"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.4"><path d="M12 5v14M5 12h14"></path></svg></span></div>
  <div class="pp-petcard pp-clay" data-dc="pp/petcard">
    <div class="ph"><img src="assets/pet-corgi.png" alt="" data-act="toast" data-msg="旺财蹭了蹭你的手（演示）"></div>
    <div class="nm">旺财</div>
    <div class="bd">柯基 · 2 岁 4 个月 · 已绝育 · 芯片 3920</div>
    <div class="pp-rings" data-dc="pp/rings">
      <span class="r" data-act="toast" data-msg="体力 80：今天还能跑 5 圈（演示）"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#f3e6d2" stroke-width="6"></circle><circle cx="23" cy="23" r="18" fill="none" stroke="#7fd8be" stroke-width="6" stroke-linecap="round" stroke-dasharray="90 113" transform="rotate(-90 23 23)"></circle><text x="23" y="27" text-anchor="middle" font-size="12" fill="#4a3f35" font-weight="600">80</text></svg><span class="lb">体力</span></span>
      <span class="r" data-act="toast" data-msg="心情 92：刚吃了冻干（演示）"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#f3e6d2" stroke-width="6"></circle><circle cx="23" cy="23" r="18" fill="none" stroke="#ffb38a" stroke-width="6" stroke-linecap="round" stroke-dasharray="104 113" transform="rotate(-90 23 23)"></circle><text x="23" y="27" text-anchor="middle" font-size="12" fill="#4a3f35" font-weight="600">92</text></svg><span class="lb">心情</span></span>
      <span class="r" data-act="toast" data-msg="社交 65：认识了 3 个新朋友（演示）"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#f3e6d2" stroke-width="6"></circle><circle cx="23" cy="23" r="18" fill="none" stroke="#c9b6f2" stroke-width="6" stroke-linecap="round" stroke-dasharray="73 113" transform="rotate(-90 23 23)"></circle><text x="23" y="27" text-anchor="middle" font-size="12" fill="#4a3f35" font-weight="600">65</text></svg><span class="lb">社交</span></span>
    </div>
  </div>
  <div class="pp-rows pp-clay" data-dc="pp/rows">
    <div class="pp-row" data-act="toast" data-msg="疫苗：四联 2026-03 已接种，狂犬 2026-05 已接种（演示）"><span class="ic" style="background:#e8f7ee"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#3fae83;stroke-width:2"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="lb">疫苗记录</span><span class="mt">全齐 · 2 剂</span></div>
    <div class="pp-row" data-act="toast" data-msg="体重曲线：近 3 月 +0.6kg，处于理想区间（演示）"><span class="ic" style="background:#ffece1"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#e07b39;stroke-width:2"><path d="M4 19h16M7 16l4-6 3 4 3-7"></path></svg></span><span class="lb">体重趋势</span><span class="mt">12.4 kg · 理想</span></div>
    <div class="pp-row" data-act="toast" data-msg="健康提醒：下次体外驱虫 10-02（演示）"><span class="ic" style="background:#efe7fb"><svg width="15" height="15" viewBox="0 0 24 24" style="fill:none;stroke:#8a63d2;stroke-width:2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg></span><span class="lb">健康提醒</span><span class="mt">驱虫 10-02</span></div>
  </div>
  <div class="pp-minis" data-dc="pp/minis">
    <div class="pp-mini pp-clay" data-act="toast" data-msg="团子：猫 · 1 岁（演示）"><img src="assets/pet-cat.png" alt=""><div><div class="nm">团子</div><div class="bd">猫 · 1 岁</div></div></div>
    <div class="pp-mini pp-clay" data-act="toast" data-msg="雪饼：兔 · 8 个月（演示）"><img src="assets/pet-bunny.png" alt=""><div><div class="nm">雪饼</div><div class="bd">兔 · 8 个月</div></div></div>
  </div>
  <div class="pp-tabs" data-dc="pp/tabs"><span data-goto="01-home">首页</span><span class="on" data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span data-goto="05-me">我的</span></div>
</div>

<script>
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]");
  if (g) { location.href = g.getAttribute("data-goto") + ".html"; }
});
</script>
</body>
</html>
