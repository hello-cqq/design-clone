<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物乐园 · 01-home — 自研原创示例站</title>
<style>html,body{margin:0;padding:0}body{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(120,90,60,.12);min-height:100vh}</style>
<style>
  .pp-root{font-family:ui-rounded,-apple-system,"PingFang SC","Segoe UI",sans-serif;color:#4a3f35;background:
    radial-gradient(120% 60% at 50% -10%, #fff7ea 0%, #fdf3e3 45%, #fbeeda 100%);min-height:100%;position:relative;padding:52px 16px 108px;box-sizing:border-box}
  .pp-clay{background:#fffdf8;border-radius:24px;box-shadow:0 10px 24px rgba(180,140,90,.16), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -3px 0 rgba(190,150,100,.10);border:1px solid rgba(210,180,140,.25)}
  .pp-head{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
  .pp-head .logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,#ffb38a,#ff9d6b);display:grid;place-items:center;box-shadow:0 6px 12px rgba(255,157,107,.35), inset 0 2px 0 rgba(255,255,255,.6)}
  .pp-head .t{font-size:19px;font-weight:600;letter-spacing:.02em}
  .pp-head .wx{margin-left:auto;font-size:11px;color:#a08d76;background:#fffdf8;border-radius:999px;padding:6px 12px;box-shadow:0 4px 10px rgba(180,140,90,.12)}
  .pp-hero{position:relative;padding:14px 14px 6px;overflow:hidden;margin-bottom:14px}
  .pp-hero svg{width:100%;height:auto;display:block}
  .pp-hero .pet{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:126px;height:126px;object-fit:cover;border-radius:30px;border:4px solid #fffdf8;box-shadow:0 16px 26px rgba(120,90,60,.28), inset 0 2px 0 rgba(255,255,255,.6);cursor:pointer}
  .pp-hero .chip{position:absolute;top:12px;left:12px;background:#fffdf8;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:500;box-shadow:0 4px 10px rgba(180,140,90,.14);cursor:pointer}
  .pp-hero .chip2{position:absolute;top:12px;right:12px;background:#7fd8be;color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:500;box-shadow:0 6px 12px rgba(127,216,190,.4);cursor:pointer}
  .pp-acts{display:flex;gap:10px;margin-bottom:14px}
  .pp-act{flex:1;padding:12px 8px;text-align:center;cursor:pointer}
  .pp-act .ic{width:38px;height:38px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 5px 10px rgba(180,140,90,.16)}
  .pp-act .lb{font-size:12px;font-weight:600}
  .pp-act .sb{font-size:10px;color:#a08d76;margin-top:2px}
  .pp-pass{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:14px;cursor:pointer}
  .pp-pass .qr{width:56px;height:56px;border-radius:14px;background:#4a3f35;display:grid;place-items:center;flex:none}
  .pp-pass .t{font-size:14px;font-weight:600}
  .pp-pass .d{font-size:11px;color:#a08d76;margin:4px 0 6px}
  .pp-pass .bar{height:6px;border-radius:999px;background:#f3e6d2;overflow:hidden}
  .pp-pass .bar i{display:block;height:100%;width:64%;border-radius:999px;background:linear-gradient(90deg,#7fd8be,#5cc9ab)}
  .pp-feed{padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .pp-feed img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 4px 8px rgba(120,90,60,.2)}
  .pp-feed .t{font-size:13px;font-weight:600}
  .pp-feed .d{font-size:11px;color:#a08d76;margin-top:2px}
  .pp-feed .go{margin-left:auto;color:#ff9d6b;font-size:12px;font-weight:600}
  .pp-tabs{position:absolute;left:14px;right:14px;bottom:26px;background:#fffdf8;border-radius:999px;display:flex;justify-content:space-around;padding:10px 6px;box-shadow:0 10px 24px rgba(180,140,90,.2), inset 0 2px 0 rgba(255,255,255,.9);z-index:8}
  .pp-tabs span{font-size:12px;color:#b3a28c;cursor:pointer;padding:6px 10px;border-radius:999px}
  .pp-tabs span.on{background:linear-gradient(140deg,#ffe3d1,#ffd2b8);color:#c05e2a;font-weight:600}
</style>
</head>
<body>
<div data-dc="pp/root" class="pp-root">
  <div class="pp-head" data-dc="pp/head"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:#fff"><ellipse cx="7" cy="8" rx="2.4" ry="3.1"></ellipse><ellipse cx="12" cy="6.6" rx="2.4" ry="3.1"></ellipse><ellipse cx="17" cy="8" rx="2.4" ry="3.1"></ellipse><path d="M12 11c3.4 0 6 2.6 6 5.2 0 1.7-1.3 2.8-3 2.8-1.2 0-2-.5-3-.5s-1.8.5-3 .5c-1.7 0-3-1.1-3-2.8C9 13.6 11.6 11 12 11z"></path></svg></span><span class="t">宠物乐园</span><span class="wx" data-act="toast" data-msg="今日晴朗 · 适宜出游（演示）">晴 26° · 优</span></div>
  <div class="pp-hero pp-clay" data-dc="pp/hero">
    <svg viewBox="0 0 340 190" aria-hidden="true">
      <ellipse cx="170" cy="150" rx="150" ry="34" fill="#e8f7ee"></ellipse>
      <ellipse cx="170" cy="142" rx="128" ry="28" fill="#c9efd9"></ellipse>
      <ellipse cx="86" cy="132" rx="52" ry="16" fill="#bfe6f7"></ellipse>
      <ellipse cx="86" cy="129" rx="40" ry="12" fill="#9ed4ef"></ellipse>
      <ellipse cx="252" cy="128" rx="46" ry="15" fill="#ffe3d1"></ellipse>
      <path d="M236 122 q16 -26 34 -6" stroke="#ff9d6b" stroke-width="7" fill="none" stroke-linecap="round"></path>
      <ellipse cx="170" cy="120" rx="64" ry="18" fill="#a9e3c4"></ellipse>
      <g fill="#8fd8ae"><circle cx="128" cy="112" r="7"></circle><circle cx="212" cy="110" r="8"></circle><circle cx="188" cy="118" r="5"></circle></g>
      <g fill="#fff"><circle cx="60" cy="40" r="12"></circle><circle cx="76" cy="36" r="15"></circle><circle cx="94" cy="42" r="11"></circle><circle cx="262" cy="30" r="10"></circle><circle cx="276" cy="27" r="13"></circle></g>
    </svg>
    <img class="pet" src="assets/pet-corgi.png" alt="" data-act="toast" data-msg="旺财：汪！今天去草坪区玩（演示）">
    <span class="chip" data-act="toast" data-msg="园区营业中 09:00-21:00（演示）">营业中 · 09-21 点</span>
    <span class="chip2" data-goto="03-map">乐园地图</span>
  </div>
  <div class="pp-acts" data-dc="pp/acts">
    <div class="pp-act pp-clay" data-act="sheet" data-title="预约入园" data-items="今天 14:00|今天 16:00|明天 10:00"><span class="ic" style="background:#e8f7ee"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#3fae83;stroke-width:2"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg></span><div class="lb">预约</div><div class="sb">今日余 12 位</div></div>
    <div class="pp-act pp-clay" data-act="toast" data-msg="已为你匹配遛伴：豆豆（柯基 · 2 岁）（演示）"><span class="ic" style="background:#ffece1"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#e07b39;stroke-width:2"><path d="M4 12a8 8 0 0 1 16 0"></path><circle cx="12" cy="16" r="3"></circle></svg></span><div class="lb">遛伴</div><div class="sb">附近 8 只</div></div>
    <div class="pp-act pp-clay" data-act="toast" data-msg="打卡成功：草坪区 +5 积分（演示）"><span class="ic" style="background:#efe7fb"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:none;stroke:#8a63d2;stroke-width:2"><path d="M12 3l2.4 5 5.6.7-4 3.9 1 5.4-5-2.7-5 2.7 1-5.4-4-3.9 5.6-.7z"></path></svg></span><div class="lb">打卡</div><div class="sb">连打 3 天</div></div>
  </div>
  <div class="pp-pass pp-clay" data-dc="pp/pass" data-act="toast" data-msg="入园码已刷新（演示）">
    <span class="qr"><svg width="30" height="30" viewBox="0 0 24 24" style="fill:#fff"><path d="M3 3h8v8H3zM6 6h2v2H6zM13 3h8v8h-8zM16 6h2v2h-2zM3 13h8v8H3zM6 16h2v2H6zM14 14h3v3h-3zM19 16h2v2h-2zM15 19h2v2h-2z"></path></svg></span>
    <div style="flex:1"><div class="t">今日入园通行证</div><div class="d">旺财 · 柯基 | 草坪区 + 戏水区</div><div class="bar"><i></i></div></div>
  </div>
  <div class="pp-feed pp-clay" data-dc="pp/feed" data-goto="04-community"><img src="assets/pet-cat.png" alt=""><div><div class="t">团子的乐园日记</div><div class="d">今天在猫爬架区征服了最高层…</div></div><span class="go">去围观</span></div>
  <div class="pp-tabs" data-dc="pp/tabs"><span class="on" data-goto="01-home">首页</span><span data-goto="02-pets">档案</span><span data-goto="03-map">地图</span><span data-goto="04-community">社区</span><span data-goto="05-me">我的</span></div>
</div>

<script>
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]");
  if (g) { location.href = g.getAttribute("data-goto") + ".html"; }
});
</script>
</body>
</html>
