  IA：左 rail（页面|场景）；右「详情」单看板；底栏图标 pill（阅读|编辑|标注|边框|文字|播放|撤销|还原）。

<div id="dc-topbar">
  <span class="dc-logo"></span>
  <span id="dc-title">宠物乐园</span>
  <span id="dc-crumb"><span id="dc-cur">—</span></span>
  <span class="dc-spacer"></span>
  <div id="dc-viewmode">
    <button data-vm="preview" class="on" title="预览"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span>预览</span></button>
    <button data-vm="code" title="代码"><svg viewBox="0 0 24 24"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/></svg><span>代码</span></button>
  </div>
  <div id="dc-device-wrap">
    <button id="dc-device-btn" class="dc-tb" title="设备类型（覆盖 platform.json）" aria-haspopup="true" aria-expanded="false"><span id="dc-device-label">设备</span> ▾</button>
    <div id="dc-device-dd" hidden role="menu"></div>
  </div>
  <div id="dc-share-wrap">
    <button id="dc-share-btn" class="dc-ic" title="分享：状态链接 / 纯净版 / 卡片版 / 全屏演示" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v14"/></svg></button>
    <div id="dc-share-dd" hidden role="menu"></div>
  </div>
  <button id="dc-shot-btn" class="dc-ic" title="截图：导出当前页 PNG"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
  <button id="dc-compare-btn" class="dc-ic" title="对照原截图"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 3v18"/></svg></button>
  <button id="dc-theme" class="dc-ic" title="明暗主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
  <button id="dc-demo" class="dc-ic" title="演示模式 D"><svg viewBox="0 0 24 24"><path d="m6 4 14 8-14 8z"/></svg></button>
  <div id="dc-export-wrap">
    <button id="dc-export-btn" class="dc-tb primary">导出 ▾</button>
    <div id="dc-export-dd" hidden></div>
  </div>
</div>

<div id="dc-shell">
  <nav id="dc-rail">
    <button data-ia="pages" class="on" title="页面（1）">
      <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/></svg><span>页面</span></button>
    <button data-ia="scene" title="场景（2）· 树与路径">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8 6h4a3 3 0 0 1 3 3v0M8 18h4a3 3 0 0 0 3-3v0"/></svg><span>场景</span></button>
  </nav>

  <aside id="dc-left">
    <div id="dc-left-search">
      <input id="dc-q" class="dc-inp" type="search" placeholder="筛选页面 / 场景…" aria-label="筛选页面或场景" autocomplete="off">
    </div>
    <div id="dc-left-pages">
      <div class="dc-sec">页面 PAGES</div>
      <div id="dc-pages"></div>
    </div>
    <div id="dc-left-scene" hidden>
      <div class="dc-sec">场景 SCENES</div>
      <div id="dc-tree"></div>
    </div>
    <button id="dc-left-fold" title="折叠/展开左栏">‹</button>
  </aside>

    <div id="dc-single">
      <div id="dc-zoomwrap">
        <div id="dc-phone"><div id="dc-screen"><div id="dc-stage"></div></div></div>
      </div>
      <div id="dc-overlay"></div>
    </div>
    <div id="dc-flow" hidden>
      <div id="dc-flow-toggle">

      </div>
      <div id="dc-flow-canvas"></div>
    </div>
    <div id="dc-code" hidden>
      <div id="dc-code-head"><b id="dc-code-title"></b><button id="dc-code-copy" class="dc-btn">复制</button><button id="dc-code-open" class="dc-btn">新标签打开</button></div>
      <pre id="dc-code-pre"></pre>
    </div>
  </main>

    <button id="dc-right-fold" title="折叠/展开右栏">›</button>
  </aside>
</div>

  <button id="dc-read" class="on" title="阅读"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><span class="lb">阅读</span></button>
