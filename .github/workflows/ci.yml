name: ci
on:
  push: { branches: ["main"] }
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install (repo devDeps + skill deps)
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix skills/design-clone/scripts
      - name: unit + integration tests (node:test)
        run: npm test
      - name: lint (eslint, 0 errors)
        run: npm run lint
      - name: typecheck (tsc --noEmit on pure modules)
        run: npm run typecheck
      - name: ip + secret scans
        run: npm run scan
      - name: shell build determinism
        run: |
          node skills/design-clone/scripts/build-shell.mjs --out /tmp/a.js
          node skills/design-clone/scripts/build-shell.mjs --out /tmp/b.js
          cmp /tmp/a.js /tmp/b.js && node --check /tmp/a.js
      - name: version sync (SKILL.md == package.json == CHANGELOG top)
        run: |
          node -e '
            const fs=require("fs");
            const sk=fs.readFileSync("skills/design-clone/SKILL.md","utf8").match(/version: "([^"]+)"/)[1];
            const pk=JSON.parse(fs.readFileSync("package.json","utf8")).version;
            const cl=fs.readFileSync("CHANGELOG.md","utf8").match(/## \[(?!Unreleased)([^\]]+)\]/)[1];
            if(!(sk===pk&&pk===cl)){console.error(`version drift: skill=${sk} pkg=${pk} changelog=${cl}`);process.exit(1)}
            console.log("version sync ok:",sk);
          '
      - name: doctor (environment probe, advisory)
        run: node skills/design-clone/scripts/doctor.mjs || true
  site-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund --prefix skills/design-clone/scripts
      - name: serve site
        run: python3 -m http.server 8090 --directory site &
      - name: functional e2e (20 loops)
        run: NODE_PATH=$PWD/skills/design-clone/scripts/node_modules node site/tools/e2e.mjs http://localhost:8090 20
      - name: load smoke (500 req / 50 conc)
        run: node site/tools/loadtest.mjs http://localhost:8090 50 10
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: package skill zip
        run: node skills/design-clone/scripts/package.mjs --out /tmp/design-clone.zip
      - name: zip must not contain runs/binaries/devDeps
        run: |
          python3 - <<'EOF'
          import zipfile, sys
          names = zipfile.ZipFile("/tmp/design-clone.zip").namelist()
          ALLOW_BIN = ("skills/design-clone/references/official-icons/",)  # M98: 策展官方图标登记（归属 THIRD-PARTY.md）
          bad = [n for n in names if any(k in n for k in ("design-clone-runs/", "node_modules/", ".git/", "inspector.built.js")) or (n.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".gif", ".zip", ".woff", ".woff2", ".ttf", ".mp4")) and not n.startswith(ALLOW_BIN))]
          print("entries:", len(names))
          sys.exit(1 if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: design-clone-zip-ci, path: /tmp/design-clone.zip }
