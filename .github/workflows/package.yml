name: package
on:
  push: { tags: ["v*"] }
jobs:
  zip:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: package
        run: node skills/design-clone/scripts/package.mjs --out dist/design-clone.zip
      - uses: actions/upload-artifact@v4
        with: { name: design-clone-zip, path: dist/design-clone.zip }
