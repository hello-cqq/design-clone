name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # daily: refresh gallery fallback snapshot
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: embed gallery fallback snapshot
        run: |
          curl -fsSL --max-time 20 https://hello-cqq.github.io/design-clone-prototype/index.json -o site/data/index.fallback.json \
            || echo "keep committed fallback"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
